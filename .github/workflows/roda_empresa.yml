name: Roda Empresa IA
on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Baixa codigo
        uses: actions/checkout@v3
      - name: Configura Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Instala dependencias
        run: pip install -r requirements.txt
      - name: Roda empresa
        run: python main.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      - name: Salva resultado
        uses: actions/upload-artifact@v3
        with:
          name: resultado-empresa
          path: resultado_empresa.txt
