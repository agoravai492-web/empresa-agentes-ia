name: Empresa Afiliado 2x por dia
on:
  schedule:
    - cron: '0 11 * * *'
    - cron: '0 21 * * *'
  workflow_dispatch:
jobs:
  gerar-video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -r requirements.txt
      - run: python main.py
      - uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_number }}
          path: |
            resultado_empresa.txt
            video_*.txt
