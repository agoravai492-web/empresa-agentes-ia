name: Gera Videos Sozinho

on:
  schedule:
    - cron: '0 11:00 * * *' # 8h Brasil
    - cron: '0 21:00 * * *' # 18h Brasil
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gerar-video:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pillow moviepy pytz imageio imageio-ffmpeg

      - name: Gerar video do dia
        run: python main.py

      - name: Commit arquivos
        run: |
          git config --local user.email "bot@empresa.com"
          git config --local user.name "Empresa IA Bot"
          git add .
          git diff --staged --quiet || git commit -m "Video do dia $(date +'%Y-%m-%d %H:%M')"
          git push
