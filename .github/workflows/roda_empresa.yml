name: Empresa IA - Gera Videos Sozinho

on:
  schedule:
    - cron: '0 11 * * *'   # 8h Brasil = 11h UTC - SAUDE
    - cron: '0 21 * * *'   # 18h Brasil = 21h UTC - COZINHA
  workflow_dispatch:      # Botao para rodar manual quando quiser

jobs:
  gerar-video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Instala bibliotecas
        run: |
          pip install pytz
          
      - name: Gera video do dia
        run: |
          python main.py
          
      - name: Salva videos na nuvem
        run: |
          git config --global user.name "Robo Empresa IA"
          git config --global user.email "robo@empresa-ia.com"
          git add .
          git commit -m "Video gerado automatico - $(date)" || echo "Nada novo"
          git push
